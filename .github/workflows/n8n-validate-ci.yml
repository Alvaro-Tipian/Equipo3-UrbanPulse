name: n8n Validate CI

on:
  pull_request:
    branches:
      - main

jobs:
  governance:
    name: Gobernanza PR
    runs-on: ubuntu-latest
    steps:
      - name: Chequear el PR title con Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Permite que PRs de Dependabot (etiquetados con 'dependencies') no sean
          # bloqueados aunque su título no siga Conventional Commits.
          ignoreLabels: |
            dependencies
            automated pr

  n8n_security:
    name: Seguridad en workflows n8n
    # Desacoplado de 'governance': el escáner de secretos corre
    # independientemente de si el título del PR es convencional o no.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Escanear workflows n8n en busca de credenciales quemadas
        shell: bash
        run: |
          set -e

          if [ ! -d src/n8n-workflows ]; then
            echo 'No existe src/n8n-workflows.'
            exit 0
          fi
          if [ -z "$(find src/n8n-workflows -type f -name '*.json' -print -quit)" ]; then
            echo 'No se encontraron archivos JSON en src/n8n-workflows.'
            exit 0
          fi

          # grep -R sobre el directorio, no sobre una lista de rutas expandida
          # sin comillas: asi cada workflow con espacios en el nombre se partia
          # en varios "archivos" inexistentes y nunca se llegaba a escanear.
          # Eran justo los de produccion (Central, Dashboard KPIs, Errores a
          # Service Desk), que son los que tienen credenciales de verdad.
          secrets=$(grep -RInE '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|Bearer [A-Za-z0-9._-]{15,}|"(api_key|apiKey|API_KEY)"[[:space:]]*:[[:space:]]*"[^"]{6,}")' --include='*.json' src/n8n-workflows || true)
          if [ -n "$secrets" ]; then
            echo '🚨 Se detectaron posibles credenciales hardcodeadas en los workflows n8n:'
            echo "$secrets"
            exit 1
          fi
          echo '✅ Escaneo de seguridad n8n completado sin hallazgos.'
