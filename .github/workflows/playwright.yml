name: Playwright Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'ia-ops/tests/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'ia-ops/tests/**'
      - '.github/workflows/playwright.yml'

defaults:
  run:
    working-directory: ia-ops/tests

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            ia-ops/tests/package-lock.json
            src/frontend/package-lock.json
            mf-dashboard/package-lock.json
            mf-mapa-urbano/package-lock.json
            mf-chatbot/package-lock.json
      - name: Instalar dependencias (ia-ops/tests)
        run: npm ci
      - name: Instalar dependencias del frontend (src/frontend)
        run: npm ci
        working-directory: src/frontend
      - name: Instalar dependencias de los microfrontends
        # Usar github.workspace para resolver rutas desde la raíz del repo,
        # ya que el default working-directory es ia-ops/tests.
        working-directory: ${{ github.workspace }}
        run: |
          npm ci --prefix mf-dashboard
          npm ci --prefix mf-mapa-urbano
          npm ci --prefix mf-chatbot
      - name: Instalar navegador Chromium de Playwright
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas Playwright
        run: npx playwright test
      - name: Publicar reporte Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: ia-ops/tests/playwright-report/
          retention-days: 30