name: Playwright Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'ia-ops/tests/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'ia-ops/tests/**'
      - '.github/workflows/playwright.yml'

defaults:
  run:
    working-directory: ia-ops/tests

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ia-ops/tests/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Instalar dependencias del frontend
        run: npm ci
        working-directory: src/frontend
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps
      - name: Ejecutar pruebas Playwright
        run: npx playwright test
      - name: Publicar reporte Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ia-ops/tests/playwright-report/
          retention-days: 30