name: Frontend DevSecOps CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - 'mf-*/**'
      - 'packages/shared/**'
      - 'ia-ops/tests/playwright.config.ts'
      - 'ia-ops/tests/tests/contrato-host-remotes.spec.ts'
      - 'scripts/sast-frontend-scanner.js'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - 'mf-*/**'
      - 'packages/shared/**'
      - 'ia-ops/tests/playwright.config.ts'
      - 'ia-ops/tests/tests/contrato-host-remotes.spec.ts'
      - 'scripts/sast-frontend-scanner.js'
      - '.github/workflows/frontend-ci.yml'

jobs:
  sast-codeql:
    name: Análisis de Seguridad React (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    - name: Inicializar CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript
    - name: Ejecutar Análisis CodeQL
      uses: github/codeql-action/analyze@v3

  sast-secrets-and-network-audit:
    name: Análisis Estático SAST (Secretos y Variables de Red)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Ejecutar Escáner SAST de Secretos y Variables de Red
      run: node scripts/sast-frontend-scanner.js

  calidad-eslint-sca:
    name: Auditoría de Código y Dependencias
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validar Shell Frontend
      run: |
        cd src/frontend
        npm ci
        npm run lint --if-present
        npm run build
        npm audit --audit-level=critical

    - name: Ejecutar Tests de Route Guards
      run: |
        cd src/frontend
        npm run test -- routeGuards.test.jsx --coverage --collectCoverageFrom="src/components/**/*.jsx"

    - name: Subir reporte de cobertura
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-report
        path: src/frontend/coverage/

    - name: Validar MF Dashboard
      run: |
        cd mf-dashboard
        npm ci
        npm run lint --if-present
        npm run build
        npm audit --audit-level=critical

    - name: Validar MF Mapa
      run: |
        cd mf-mapa-urbano
        npm ci
        npm run lint --if-present
        npm run build
        npm audit --audit-level=critical

    - name: Validar MF Chatbot
      run: |
        cd mf-chatbot
        npm ci
        npm run lint --if-present
        npm run build
        npm audit --audit-level=critical

  contrato-host-remotes:
    # HT-39 T04. El host y cada microfrontend compilan por separado, asi que un
    # `exposes` renombrado o una entrada que falta en el manifiesto pasan lint y
    # build en ambos lados y solo fallan al montar. Este job los levanta juntos.
    name: Contrato host-remotes (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v7
    - name: Configurar Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: |
          ia-ops/tests/package-lock.json
          src/frontend/package-lock.json
          mf-*/package-lock.json

    - name: Instalar dependencias del host, los remotos y la suite
      # Los ocho remotos que el host consume (ver los cargarRemote() de
      # src/frontend/src/App.jsx); la propia prueba falla si esa lista cambia.
      run: |
        for proyecto in ia-ops/tests src/frontend \
                        mf-gestion-incidentes mf-mapa-urbano mf-dashboard \
                        mf-historial-reportes mf-auth mf-ajustes mf-chatbot \
                        mf-panel-riesgo; do
          npm ci --prefix "$proyecto"
        done

    - name: Instalar navegador Chromium de Playwright
      working-directory: ia-ops/tests
      run: npx playwright install --with-deps chromium

    - name: Ejecutar la prueba de contrato
      working-directory: ia-ops/tests
      run: npx playwright test contrato-host-remotes

    - name: Publicar reporte de la prueba de contrato
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: contrato-host-remotes-report
        path: ia-ops/tests/playwright-report/
        retention-days: 30
