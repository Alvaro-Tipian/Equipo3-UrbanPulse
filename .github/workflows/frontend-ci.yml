name: Frontend DevSecOps CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - 'mf-dashboard/**'
      - 'mf-mapa-urbano/**'
      - 'mf-chatbot/**'
      - 'scripts/sast-frontend-scanner.js'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - 'mf-dashboard/**'
      - 'mf-mapa-urbano/**'
      - 'mf-chatbot/**'
      - 'scripts/sast-frontend-scanner.js'
      - '.github/workflows/frontend-ci.yml'

jobs:
  sast-codeql:
    name: Análisis de Seguridad React (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    - name: Inicializar CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript
    - name: Ejecutar Análisis CodeQL
      uses: github/codeql-action/analyze@v3

  sast-secrets-and-network-audit:
    name: Análisis Estático SAST (Secretos y Variables de Red)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Ejecutar Escáner SAST de Secretos y Variables de Red
      run: node scripts/sast-frontend-scanner.js

  calidad-eslint-sca:
    name: Auditoría de Código y Dependencias
    runs-on: ubuntu-latest
    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v7
    - name: Configurar Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Validar Shell Frontend
      run: |
        cd src/frontend
        npm ci
        npm run lint --if-present
        npm run build
        npm audit --audit-level=critical

    - name: Ejecutar Tests de Route Guards
      run: |
        cd src/frontend
        npm run test -- routeGuards.test.jsx --coverage --collectCoverageFrom="src/components/**/*.jsx"

    - name: Subir reporte de cobertura
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: frontend-coverage-report
        path: src/frontend/coverage/

    - name: Validar MF Dashboard
      run: |
        cd mf-dashboard
        npm ci
        npm run lint --if-present
        npm run build
        npm audit --audit-level=critical

    - name: Validar MF Mapa
      run: |
        cd mf-mapa-urbano
        npm ci
        npm run lint --if-present
        npm run build
        npm audit --audit-level=critical

    - name: Validar MF Chatbot
      run: |
        cd mf-chatbot
        npm ci
        npm run lint --if-present
        npm run build
        npm audit --audit-level=critical