name: MLOps - Monitoreo de Deriva y Auto Re-entrenamiento (HT-49 T03)

on:
  schedule:
    - cron: '0 0 * * *' # Ejecución diaria a medianoche
  workflow_dispatch:
    inputs:
      simulate_drift:
        description: 'Simular Data Drift para verificar auto re-entrenamiento'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  drift-monitoring:
    name: 🔍 Monitoreo de Deriva (Evidently / MLflow) & Auto Trigger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar Evaluación de Deriva del Modelo
        id: drift_eval
        run: |
          SIMULATE_FLAG=""
          if [ "${{ github.event.inputs.simulate_drift }}" == "true" ]; then
            SIMULATE_FLAG="--simulate-drift"
          fi
          
          OUTPUT=$(python ia-ops/scripts/monitor_drift.py ${SIMULATE_FLAG})
          echo "${OUTPUT}"
          
          DERIVA_VAL=$(echo "${OUTPUT}" | grep "DERIVA_DETECTADA=" | cut -d'=' -f2)
          echo "deriva=${DERIVA_VAL}" >> $GITHUB_OUTPUT

      - name: Reportar Incidente en Jira Service Desk si hay Deriva (HT-49 T03)
        if: steps.drift_eval.outputs.deriva == 'true'
        run: |
          echo "🚨 ALERTA: Data Drift detectado. Llamando a la función Serverless para registrar Incidente en Jira..."
          WEBHOOK_URL="${{ secrets.SERVERLESS_JIRA_WEBHOOK_URL }}"
          WEBHOOK_SECRET="${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
          
          if [ -z "${WEBHOOK_URL}" ] || [ -z "${WEBHOOK_SECRET}" ]; then
            echo "⚠️ AVISO: SERVERLESS_JIRA_WEBHOOK_URL o DEPLOY_WEBHOOK_SECRET no configurados. Omitiendo webhook."
            exit 0
          fi

          PAYLOAD=$(cat <<EOF
          {
            "eventType": "model_drift",
            "projectKey": "UPTI",
            "modelName": "urbanpulse_risk_classifier",
            "modelVersion": "1.0.0",
            "message": "ALERTA AUTOMÁTICA MLOps: El monitoreo diario de Evidently/MLflow ha detectado Data Drift (PSI > 0.20)."
          }
          EOF
          )

          RESPONSE=$(curl --silent --write-out "HTTPSTATUS:%{http_code}" \
            --request POST \
            --url "${WEBHOOK_URL}" \
            --header "Authorization: Bearer ${WEBHOOK_SECRET}" \
            --header "Content-Type: application/json" \
            --data "${PAYLOAD}" || true)
            
          STATUS=$(echo "${RESPONSE}" | tr -d '\n' | sed -e 's/.*HTTPSTATUS://')
          echo "Respuesta del Webhook Serverless para Drift (HTTP ${STATUS})"

      - name: Disparar Auto Re-entrenamiento en mlops-pipeline.yml (HT-49 T03)
        if: steps.drift_eval.outputs.deriva == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            console.log('🚀 Disparando automáticamente mlops-pipeline.yml para re-entrenar modelo Challenger...');
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'mlops-pipeline.yml',
              ref: 'main',
              inputs: {
                action_mode: 'deploy_new_champion'
              }
            });
            console.log('✅ Re-entrenamiento automático solicitado a GitHub Actions.');

      - name: Publicar Summary en GitHub Actions
        if: always()
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 📈 Reporte de Monitoreo MLOps (Data Drift & Performance)

          - **Modelo Auditado:** `urbanpulse_risk_classifier`
          - **Estado de Deriva (`deriva`):** ${{ steps.drift_eval.outputs.deriva == 'true' && '🚨 **DERIVA DETECTADA (Re-entrenamiento iniciado)**' || '🟢 **SISTEMA ESTABLE (No Drift)**' }}
          - **Acción Ejecutada:** ${{ steps.drift_eval.outputs.deriva == 'true' && 'Ticket de Incidente Creado en Jira + Re-entrenamiento automático en mlops-pipeline.yml' || 'Monitoreo diario completado sin novedad.' }}
          EOF

      - name: Subir Reporte JSON de Monitoreo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-monitoring-report
          path: docs/DRIFT_MONITORING_REPORT.json
          retention-days: 30
