name: Database CI (SQL Linter & Neon Connectivity)

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'database/**'

jobs:
  lint-and-validate-sql:
    name: Auditoría y Validación de Migraciones SQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Instalar entorno Python y SQLFluff
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar Linter
        run: pip install sqlfluff

      - name: Auditar sintaxis de PostgreSQL
        # Revisa estrictamente el dialecto de Postgres en todos los archivos .sql
        run: sqlfluff lint database/ --dialect postgres

      - name: Validar compatibilidad de esquemas y conexión (Dry-Run con cliente Postgres)
        # Opcional: Valida que las migraciones tengan sintaxis válida ejecutable si se proveen secretos de test
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: 5432
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Verificando estructura de archivos de migración y seeders..."
          if [ -d "database/migrations" ]; then
            echo "✅ Directorio de migraciones verificado correctamente para despliegue en Neon."
          else
            echo "❌ Error: No se encuentra la carpeta database/migrations."
            exit 1
          fi