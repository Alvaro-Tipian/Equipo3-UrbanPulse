name: Pruebas QA (Postman/Newman)

on:
  workflow_dispatch:
    inputs:
      folder:
        description: >
          Carpeta a correr dentro de la colección (opcional). Déjalo vacío
          para correr toda la colección. Debe coincidir exactamente con el
          nombre, p. ej. "1. Pruebas Funcionales (camino feliz completo)".
        required: false
        type: string

jobs:
  newman:
    name: Ejecutar colección UrbanPulse - Pruebas QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Newman y el reporter HTML
        run: npm install -g newman newman-reporter-htmlextra

      - name: Correr la colección de Postman
        env:
          # N8N_CHAT_WEBHOOK_URL (no N8N_WEBHOOK_URL): ese otro secret ya lo
          # usan aws-health-check.yml y scripts/verify-poc-deployment.js
          # apuntando al endpoint viejo /webhook/urbanpulse/report. El
          # webhook conversacional real vive en /webhook/urbanpulse/chat.
          N8N_WEBHOOK_URL: ${{ secrets.N8N_CHAT_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: |
          FOLDER_ARG=""
          if [ -n "${{ inputs.folder }}" ]; then
            FOLDER_ARG="--folder ${{ inputs.folder }}"
          fi

          newman run "postman/collections/UrbanPulse - Pruebas QA/.resources/UrbanPulse  Pruebas QA.postman_collection.json" \
            --env-var "n8n_webhook_url=$N8N_WEBHOOK_URL" \
            --env-var "gemini_api_key=$GEMINI_API_KEY" \
            --env-var "tomtom_api_key=$TOMTOM_API_KEY" \
            $FOLDER_ARG \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export newman-report/report.html

      - name: Subir reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report/
          retention-days: 30
